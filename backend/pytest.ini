[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    integration: requires PostgreSQL via TEST_DATABASE_URL
filterwarnings =
    error::sqlalchemy.exc.SAWarning
    # Starlette's TestClient nudges toward httpx2; the spec mandates HTTPX.
    ignore:Using `httpx` with `starlette.testclient`
