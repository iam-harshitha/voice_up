# Security headers, included in EVERY location of nginx.conf.
#
# Why an include and not server-level add_header: nginx inherits add_header from an
# outer level only when the inner level declares no add_header of its own. Locations
# that set Cache-Control would otherwise silently drop all of these.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
# Only meaningful over HTTPS (set by the TLS terminator in front); browsers ignore it on http.
add_header Strict-Transport-Security "max-age=31536000" always;
