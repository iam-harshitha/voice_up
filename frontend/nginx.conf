# Serves the dashboard and proxies the API on one origin.
# "api" is the API service's hostname inside the deployment network.
#
# Every location includes the security-header snippet: nginx does not inherit
# add_header into a location that declares its own (see nginx-security-headers.conf).
# Validate the effective config with:  nginx -t   (see backend/docs/deployment.md)
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        client_max_body_size 300k;
    }

    # Fingerprinted build output: safe to cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        # One Cache-Control header (no `expires`, which would add a second one).
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Single-page app: unknown paths render index.html (never cached).
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
